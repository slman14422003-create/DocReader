name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout الكود
        uses: actions/checkout@v4

      - name: إعداد JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: إعداد Android SDK
        uses: android-actions/setup-android@v3

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: بناء APK (Debug)
        run: gradle assembleDebug --stacktrace

      - name: رفع الـ APK كمخرج (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: DocReader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout الكود
        uses: actions/checkout@v4

      - name: إعداد JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: إعداد Android SDK
        uses: android-actions/setup-android@v3

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: بناء APK (Release غير موقّع)
        run: gradle assembleRelease --stacktrace

      - name: إنشاء إصدار GitHub تلقائي
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "بناء تلقائي #${{ github.run_number }}"
          files: app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
