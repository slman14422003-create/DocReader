plugins {
    id 'com.android.application'
}

android {
    namespace 'com.docreader.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.docreader.app"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            // قارئ PDF يضم مكتبات أصلية (Tesseract): نُبقي معماريات الهواتف الحقيقية فقط لتقليل الحجم
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }

    buildFeatures {
        viewBinding true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // قارئ PDF المتقدّم (منقول من تطبيق الفيزيو)
    // استخراج النص/إحداثيات الأسطر من PDF للقراءة الصوتية والترجمة
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    // الأصوات العصبية (WebSocket في EdgeTtsClient)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // التعرّف الضوئي على الحروف (PDF ممسوح ضوئيًا) - نموذج اللغة يُنزَّل عند أول استخدام
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.7.0'
}
