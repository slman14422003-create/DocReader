pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // مكتبة Tesseract4Android (OCR لقارئ PDF) تُنشر عبر JitPack فقط وليس Maven Central.
        // حصرناه بمجموعتها فقط حتى لا يُستعمل مصدرًا لأي مكتبة أخرى.
        maven {
            url 'https://jitpack.io'
            content {
                includeGroup 'cz.adaptech.tesseract4android'
            }
        }
    }
}

rootProject.name = "DocReader"
include ':app'
